services:
  zonaprop-bot:
    build: .
    image: zonaprop-bot:arm64
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Argentina/Buenos_Aires
      # FlareSolverr is reached by service name on the compose network.
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    environment:
      # ONLY PROXY_URL. Never HTTP_PROXY/HTTPS_PROXY: Chromium reads those from the
      # environment, its installation test fails with "Error getting browser
      # User-Agent" and the container exits 1, taking the whole fetch path down.
      - PROXY_URL=${FLARESOLVERR_PROXY_URL:-}
      - LOG_LEVEL=info
    # The host gateway belongs here, not on the bot: the process that needs a proxy
    # listening on the Docker host is Chromium.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # v3.5.2, no :latest and no v3.3.x. The version matters more than it looks:
    # v3.3.20 ships Chromium 120 (Dec 2023) and Cloudflare refused it from every
    # egress we tried, proxy or not. v3.5.2 ships Chromium 152 and solves the
    # challenge in ~11s.
    # FlareSolverr launches one Chromium per request and the fetch gate allows a
    # single request in flight, so this is sized for one browser.
    mem_limit: 1536m
    ports:
      # Loopback only: FlareSolverr drives a real browser and is abusable.
      - "127.0.0.1:8191:8191"
    healthcheck:
      # The image is Python-based, so use Python rather than assuming curl exists.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}
      - POSTGRES_DB=${POSTGRES_DB:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposed on loopback only: the integration tests and a locally run binary need
    # it, and it is not published to the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # The -h 127.0.0.1 is load-bearing: without it pg_isready connects over the
      # unix socket, which the entrypoint's temporary init server answers, so the
      # service reports healthy before it listens on TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
